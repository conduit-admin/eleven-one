<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Сайт для класса, ссылка ходит по чату: искать его поисковикам незачем. -->
<meta name="robots" content="noindex, nofollow">
<!-- Тема одна, светлая, как у «Лучезарности»: «only light» — чтобы Chrome
     на Android с тёмным режимом не перекрашивал страницу сам. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>11-1</title>
<!-- Логотип «Петли» (10.10.2026): 11-1 прописью, одной непрерывной
     линией — три петли «l», между второй и третьей связка поднимается
     на середину высоты и идёт ровно: это дефис. Линия бирюзовая #76C6BD,
     толщина 8, без обводки: чёрную обводку сняли в тот же день, а линию
     сделали толще и темнее прежней #93D2CB в 7 (владелец). Толще 8 петли
     слипаются — дальше только раздвигать сам рисунок. Иконка для
     домашнего экрана — тот же рисунок на белом квадрате.
     До него в тот же день были «Медаль» на чёрном, Bonum на платине,
     плоская бирюза в рамке, круг-плашка с бликом и «Кристалл». -->
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=9">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Оба логотипа — кнопки, а не ссылки: нажатие страницу не
         перезагружает (владелец, 10.10.2026), а только запускает
         анимацию. Рисунки встроены в разметку: приходят вместе со
         страницей и не мигают пустым местом. -->
    <button class="logo petli-btn" type="button" aria-label="11-1">
      <!-- Тот же рисунок, что assets/logo.svg. pathLength="1" — длина
           линии в долях: анимация прописывает её от 0 до 1, не зная
           настоящей длины. -->
      <svg class="brand-logo petli" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <g transform="translate(2.5 0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="petli-line" pathLength="1" stroke="#76C6BD" stroke-width="8" d="M9 80 C18 72 29 40 28 22 C27 7 12 7 14 24 C15 44 17 72 20 84 C22 92 28 90 31 80 C40 72 51 40 50 22 C49 7 34 7 36 24 C37 44 39 72 42 84 C44 92 50 90 52 76 C53 62 55 54 60 54 H65 C72 54 79 40 78 22 C77 7 62 7 64 24 C65 44 67 72 70 84 C72 92 80 92 86 82"/>
        </g>
      </svg>
    </button>
    <!-- Надписи рядом с логотипами нет (владелец, 10.10.2026): 11-1 —
         в самом логотипе, тремя петлями. Заголовок остаётся для
         читалки экрана. -->
    <h1 class="sr-only">11-1 — работы и разборы для класса</h1>
    <!-- Знак «Лучезарности» — справа, как в шапке контрольной: он стоит
         на всём, что делает владелец. Эталон — manim/kanal/logo.svg
         в knowledge, перенесён как есть. При нажатии лучи вспыхивают —
         та же анимация, что на самой «Лучезарности». -->
    <button class="logo znak-btn" type="button" aria-label="Лучезарность">
      <svg class="brand-logo znak" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#000"/>
        <g class="znak-rays" stroke="#FDD17A" stroke-width="2.6">
          <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
          <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>
          <line x1="57.0" y1="50.0" x2="80.0" y2="50.0"/>
          <line x1="56.1" y1="46.5" x2="84.6" y2="30.0"/>
          <line x1="53.5" y1="43.9" x2="65.0" y2="24.0"/>
          <line x1="50.0" y1="43.0" x2="50.0" y2="10.0"/>
          <line x1="46.5" y1="43.9" x2="35.0" y2="24.0"/>
          <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
          <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
          <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
        </g>
        <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
        <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
        <circle cx="50" cy="50" r="4.5" fill="#fff"/>
      </svg>
    </button>
  </header>

  <!-- Каркас виден, пока скрипт ходит за индексом: пустая страница на это
       время читается как зависание. Скрипт заменит его содержимым. -->
  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<script defer src="assets/app.js?v=5"></script>
</body>
</html>
