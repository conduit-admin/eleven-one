<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Сайт для класса, ссылка ходит по чату: искать его поисковикам незачем. -->
<meta name="robots" content="noindex, nofollow">
<!-- Тема одна, светлая, как у «Лучезарности»: «only light» — чтобы Chrome
     на Android с тёмным режимом не перекрашивал страницу сам. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>11-1</title>
<!-- Логотип (10.10.2026): 11-1 шрифтом TeX Gyre Bonum Bold, чёрным,
     на круге, устроенном как алмазная плашка «Бумаги»: бирюза #93D2CB,
     две косые грани света, блик сверху, светлое пятно и искра в углу,
     светлая кромка. Цифры — контуры букв, вынутые из TeX, а не шрифт.
     Иконка для домашнего экрана — те же слои на квадрате, углы
     скругляет телефон. До него в тот же день были «Медаль» на чёрном,
     Bonum на платине и плоская бирюза в рамке. -->
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Оба логотипа — кнопки, а не ссылки: нажатие страницу не
         перезагружает (владелец, 10.10.2026), а только запускает
         анимацию. Рисунки встроены в разметку: приходят вместе со
         страницей и не мигают пустым местом. -->
    <button class="logo medal-btn" type="button" aria-label="11-1">
      <!-- Тот же логотип, что assets/logo.svg, плюс блик: при нажатии
           по кругу наискось пробегает свет, как по камню. -->

        <defs><clipPath id="medal-c"><circle cx="50" cy="50" r="50"/></clipPath><linearGradient id="medal-f0" gradientUnits="userSpaceOnUse" x1="-9.706" y1="18.254" x2="109.706" y2="81.746"><stop offset="0.16" stop-color="#fff" stop-opacity="0"/><stop offset="0.165" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.19" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.195" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="medal-f1" gradientUnits="userSpaceOnUse" x1="-9.706" y1="18.254" x2="109.706" y2="81.746"><stop offset="0.24" stop-color="#fff" stop-opacity="0"/><stop offset="0.245" stop-color="#fff" stop-opacity="0.25"/><stop offset="0.34" stop-color="#fff" stop-opacity="0.25"/><stop offset="0.345" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="medal-h" gradientUnits="userSpaceOnUse" x1="28.081" y1="-10.221" x2="71.919" y2="110.221"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="medal-g" gradientUnits="userSpaceOnUse" cx="80" cy="4" r="36"><stop offset="0" stop-color="#ECFFFC" stop-opacity=".95"/><stop offset=".68" stop-color="#ECFFFC" stop-opacity="0"/></radialGradient><linearGradient id="medal-glint"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <g clip-path="url(#medal-c)"><rect width="100" height="100" fill="#93D2CB"/><rect width="100" height="100" fill="url(#medal-f0)"/><rect width="100" height="100" fill="url(#medal-f1)"/><rect width="100" height="100" fill="url(#medal-h)"/><rect width="100" height="100" fill="url(#medal-g)"/></g>
        <path class="medal-spark" fill="#fff" d="M66 14.5C66.55 19.45 66.55 19.45 71.5 20C66.55 20.55 66.55 20.55 66 25.5C65.45 20.55 65.45 20.55 60.5 20C65.45 19.45 65.45 19.45 66 14.5Z"/>
        <circle cx="50" cy="50" r="49.4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
        <g fill="#141118" transform="translate(19 40) scale(0.73700) translate(-82.171856 -52.801998)"><path transform="translate(76.712329 79.94023)" d="M22.635118 0V-3.267746L20.841843-3.427148C18.052304-3.666252 17.534247-4.024907 17.534247-6.336239V-27.138232H15.62142C15.62142-26.699875 8.368618-25.783313 5.459527-25.783313V-22.674969C10.361146-22.635118 10.560399-22.396015 10.560399-19.765878V-6.336239C10.560399-3.945205 10.161893-3.626401 6.495641-3.347447L5.459527-3.267746V0H22.635118Z"/><path transform="translate(103.013693 79.94023)" d="M22.635118 0V-3.267746L20.841843-3.427148C18.052304-3.666252 17.534247-4.024907 17.534247-6.336239V-27.138232H15.62142C15.62142-26.699875 8.368618-25.783313 5.459527-25.783313V-22.674969C10.361146-22.635118 10.560399-22.396015 10.560399-19.765878V-6.336239C10.560399-3.945205 10.161893-3.626401 6.495641-3.347447L5.459527-3.267746V0H22.635118Z"/><path transform="translate(129.315072 79.94023)" d="M13.549191-12.672478H2.669988L.797011-8.368618H11.755915L13.549191-12.672478Z"/><path transform="translate(143.661267 79.94023)" d="M22.635118 0V-3.267746L20.841843-3.427148C18.052304-3.666252 17.534247-4.024907 17.534247-6.336239V-27.138232H15.62142C15.62142-26.699875 8.368618-25.783313 5.459527-25.783313V-22.674969C10.361146-22.635118 10.560399-22.396015 10.560399-19.765878V-6.336239C10.560399-3.945205 10.161893-3.626401 6.495641-3.347447L5.459527-3.267746V0H22.635118Z"/></g>
        <g clip-path="url(#medal-c)"><g transform="rotate(25 50 50)"><rect class="medal-glint" x="-70" y="-30" width="34" height="160" fill="url(#medal-glint)"/></g></g>
      </svg>
    </button>
    <!-- Надписи рядом с логотипами нет (владелец, 10.10.2026): «11-1» написано
         на самом логотипе. Заголовок остаётся для читалки экрана. -->
    <h1 class="sr-only">11-1 — работы и разборы для класса</h1>
    <!-- Знак «Лучезарности» — справа, как в шапке контрольной: он стоит
         на всём, что делает владелец. Эталон — manim/kanal/logo.svg
         в knowledge, перенесён как есть. При нажатии лучи вспыхивают —
         та же анимация, что на самой «Лучезарности». -->
    <button class="logo znak-btn" type="button" aria-label="Лучезарность">
      <svg class="brand-logo znak" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#000"/>
        <g class="znak-rays" stroke="#FDD17A" stroke-width="2.6">
          <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
          <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>

          <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
          <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
          <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
        </g>
        <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
        <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
        <circle cx="50" cy="50" r="4.5" fill="#fff"/>
      </svg>
    </button>
  </header>

  <!-- Каркас виден, пока скрипт ходит за индексом: пустая страница на это
       время читается как зависание. Скрипт заменит его содержимым. -->
  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<script defer src="assets/app.js?v=3"></script>
</body>
</html>
