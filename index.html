<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Сайт для класса, ссылка ходит по чату: искать его поисковикам незачем. -->
<meta name="robots" content="noindex, nofollow">
<!-- Тема одна, светлая, как у «Лучезарности»: «only light» — чтобы Chrome
     на Android с тёмным режимом не перекрашивал страницу сам. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>11-1</title>
<!-- Логотип «Медаль» (10.10.2026): 11-1 жирным Computer Modern на чёрном
     круге, дефис золотом. Цифры — контуры букв cmbx12, вынутые из TeX,
     а не шрифт: так он одинаков на любом устройстве. Иконка для домашнего
     экрана — тот же набор на чёрном квадрате, углы скругляет телефон. -->
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Тот же логотип, что assets/logo.svg, встроен в разметку: приходит
         вместе со страницей и не мигает пустым местом. -->
    <a class="brand" href="./" aria-label="11-1, на главную">
      <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#141118"/>
        <g transform="translate(14.62 61.22) scale(1.38)">
          <path id="logo-1" fill="#fff" d="M8.57632-15.541483C8.57632-16.260307 8.526746-16.260307 7.733561-16.260307C5.899319-14.673936 3.147956-14.673936 2.602641-14.673936H2.131687V-13.608092H2.602641C3.470187-13.608092 4.783901-13.756815 5.775383-14.079046V-1.065843H2.329983V0C3.371039-.049574 5.97368-.049574 7.138671-.049574S10.931091-.049574 11.972147 0V-1.065843H8.57632V-15.541483Z"/>
          <use href="#logo-1" x="13.943"/>
          <path fill="#FDD17A" transform="translate(27.885 0)" d="M7.733561-4.362521V-6.64293H.297445V-4.362521H7.733561Z"/>
          <use href="#logo-1" x="37.18"/>
        </g>
      </svg>
    </a>
    <!-- Надписи рядом с логотипами нет (владелец, 10.10.2026): «11-1» написано
         на самом логотипе. Заголовок остаётся для читалки экрана. -->
    <h1 class="sr-only">11-1 — работы и разборы для класса</h1>
    <!-- Знак «Лучезарности» — справа, как в шапке контрольной: он стоит
         на всём, что делает владелец. Эталон — manim/kanal/logo.svg
         в knowledge, перенесён как есть, как на самой «Лучезарности». -->
    <svg class="brand-logo znak" viewBox="0 0 100 100" role="img" aria-label="Лучезарность">
      <circle cx="50" cy="50" r="50" fill="#000"/>
      <g stroke="#FDD17A" stroke-width="2.6">
        <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
        <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>
        <line x1="57.0" y1="50.0" x2="80.0" y2="50.0"/>
        <line x1="56.1" y1="46.5" x2="84.6" y2="30.0"/>
        <line x1="53.5" y1="43.9" x2="65.0" y2="24.0"/>
        <line x1="50.0" y1="43.0" x2="50.0" y2="10.0"/>
        <line x1="46.5" y1="43.9" x2="35.0" y2="24.0"/>
        <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
        <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
        <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
      </g>
      <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
      <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
      <circle cx="50" cy="50" r="4.5" fill="#fff"/>
    </svg>
  </header>

  <!-- Каркас виден, пока скрипт ходит за индексом: пустая страница на это
       время читается как зависание. Скрипт заменит его содержимым. -->
  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>
<script defer src="assets/app.js?v=1"></script>
</body>
</html>
